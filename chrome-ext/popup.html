<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; font-family: 'Segoe UI', sans-serif; padding: 20px; background: #000000; color: #FFFFFF; }
    h3 { margin-top: 0; color: #22C55E; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    label { font-size: 13px; color: #A3A3A3; font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; background: #121212; color: white; border: 1px solid #333; border-radius: 6px; }
    input:focus { border-color: #22C55E; outline: none; }
    button { width: 100%; padding: 12px; background: #22C55E; color: black; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 20px; font-size: 14px; }
    button:hover { background: #16A34A; }
    #status { margin-top: 15px; color: #22C55E; text-align: center; font-weight: bold; display: none; }
    .note { font-size: 11px; color: #737373; margin-top: 20px; text-align: center; }
  </style>
</head>
<body>
  <h3>Setup Alarm Profiles</h3>
  
  <label>Codeforces Profile URL</label>
  <input type="text" id="cfUrl" placeholder="https://codeforces.com/profile/tourist" />
  
  <label>LeetCode Profile URL</label>
  <input type="text" id="lcUrl" placeholder="https://leetcode.com/u/awice" />
  
  <button id="saveBtn">Save & Activate Alarm</button>
  <div id="status">Profiles Saved! Alarms Active.</div>
  
  <div class="note">When a contest is 1h or 10m away, a massive unblockable alarm will trigger on whatever browser tab you are currently using.</div>
  
  <script src="popup.js"></script>
</body>
</html>
